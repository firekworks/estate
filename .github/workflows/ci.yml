name: Estate CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: estate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test, lint and typecheck
        run: npm run verify

      - name: Production build
        run: npx next build

      - name: Install browser for isolated UI tests
        run: npx playwright install --with-deps chromium

      - name: Browser states, responsive layouts and accessibility
        run: npm run test:e2e

      - name: Preserve visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estate-product-qa
          path: docs/qa/product-pass/
